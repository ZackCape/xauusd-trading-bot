services:
  - type: web
    name: xauusd-trading-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python xauusd_trading_bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: DATA_SOURCE
        value: AUTO
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_ALERT_CHANNEL_ID
        sync: false
      - key: DISCORD_ALERT_USER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
